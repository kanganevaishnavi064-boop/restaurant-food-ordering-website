<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Place Order - Taste of Nashik</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav>
        <h1>Taste of Nashik</h1>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="menu.html">Menu</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li><a href="order.html">Order</a></li>
        </ul>
    </nav>
</header>

<section class="contact">

    <h2>Order Summary</h2>

    <div id="emptyCartMessage">
        <p>No items added yet. Please select items from the menu.</p>
    </div>

    <ul id="orderItems"></ul>

    <h3>Total Amount: ₹<span id="orderTotal">0</span></h3>

    <form onsubmit="return placeOrder()">

        <input
            type="text"
            id="name"
            placeholder="Enter Your Name"
            required
        >

        <input
            type="tel"
            id="phone"
            placeholder="Enter Mobile Number"
            required
        >

        <button type="submit">Confirm Order</button>

    </form>

</section>

<footer>
    <p>© 2026 Taste of Nashik Restaurant</p>
</footer>

<script>

const cart = JSON.parse(localStorage.getItem("cart")) || [];
const total = localStorage.getItem("total") || 0;

const orderItems = document.getElementById("orderItems");
const emptyCartMessage = document.getElementById("emptyCartMessage");

if (cart.length > 0) {

    emptyCartMessage.style.display = "none";

    cart.forEach(item => {

        const li = document.createElement("li");

        li.textContent = item.name + " - ₹" + item.price;

        orderItems.appendChild(li);

    });

}

document.getElementById("orderTotal").textContent = total;

function placeOrder() {

    if (cart.length === 0) {
        alert("Please add items from the menu first.");
        return false;
    }

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;

    if (phone.length < 10) {
        alert("Please enter a valid mobile number.");
        return false;
    }

    alert(
        "Order Placed Successfully!\n\n" +
        "Customer: " + name +
        "\nPhone: " + phone +
        "\nTotal Amount: ₹" + total
    );

    localStorage.removeItem("cart");
    localStorage.removeItem("total");

    window.location.href = "index.html";

    return false;
}

</script>

</body>
</html>
